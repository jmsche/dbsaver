services:
    mariadb:
        image: mariadb:10.11
        ports:
            - '3307:3306'
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: test_db
        volumes:
            - ./src/Faker/Provider/fixture.sql:/docker-entrypoint-initdb.d/fixture.sql
            - db_data:/var/lib/mysql
    minio:
        image: minio/minio
        environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: minio123
        volumes:
            - ./data/minio:/data
        command: server /data --address ":9004" --console-address ":9001"
        ports:
            - 9004:9004
            - 9001:9001
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:9004/minio/health/ready"]
            interval: 2s
            timeout: 2s
            retries: 60
            start_period: 5s

    createbuckets:
        image: minio/mc
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -eux -c '
            /usr/bin/mc alias set myminio http://minio:9004 minio minio123;
            until /usr/bin/mc ls myminio >/dev/null 2>&1; do
              echo "Waiting for MinIO..."; sleep 1;
            done;
            /usr/bin/mc mb -p myminio/somebucketname || true;
            /usr/bin/mc anonymous set public myminio/somebucketname || true;
            '
    ftpserver:
        environment:
            - FTP_PASS=dbsaver
            - FTP_USER=dbsaver
        image: garethflowers/ftp-server
        restart: always
        ports:
            - '20-21:20-21/tcp'
            - '40000-40009:40000-40009/tcp'
volumes:
    db_data:
